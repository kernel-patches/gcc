name: Sync upstream GCC

on:
  schedule:
    - cron: '17 3 * * *'
      timezone: 'America/Vancouver'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-gcc
  cancel-in-progress: false

env:
  BOT_NAME: BPF CI Bot
  BOT_EMAIL: bot+bpf-ci@kernel.org

jobs:
  sync:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Clone (blobless)
        run: |
          git clone --filter=blob:none --sparse \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
          git sparse-checkout set .github
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git remote add upstream https://github.com/gcc-mirror/gcc.git

      - name: Sync upstream
        run: .github/scripts/merge-upstream.sh
